# Optional: docker compose -f deploy/docker-compose.yml up -d
services:
  patchplaner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /data
    volumes:
      - patchplaner-data:/data
volumes:
  patchplaner-data:
